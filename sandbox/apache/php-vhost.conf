```apache
<VirtualHost *:80>
    ServerName php-lab.local

    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /var/log/apache2/php-lab-error.log
    CustomLog /var/log/apache2/php-lab-access.log combined

    # Keep the app server behind a minimal, explicit runtime profile
    # This is a lab example only; production should also enforce WAF,
    # request-size limits, and patched PHP runtime versions.

    php_admin_value memory_limit 256M
    php_admin_value post_max_size 16M
    php_admin_value upload_max_filesize 8M
    php_admin_value session.upload_progress.enabled 0
    php_admin_value fatal_error_backtraces 0

    php_admin_flag expose_php Off
</VirtualHost>
